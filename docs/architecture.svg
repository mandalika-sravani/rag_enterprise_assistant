30">Chat page  /</text><text x="180.0" y="154.0" text-anchor="middle" font-size="12" fill="#5b6475">app/static/index.html</text><rect x="330" y="118" width="220" height="44" rx="8" fill="#ffffff" stroke="#8a93a6" stroke-width="1.4"/><text x="440.0" y="136.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2330">Swagger /docs, curl</text><text x="440.0" y="154.0" text-anchor="middle" font-size="12" fill="#5b6475">documented API</text><rect x="740" y="118" width="230" height="44" rx="8" fill="#ffffff" stroke="#8a93a6" stroke-width="1.4"/><text x="855.0" y="136.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2330">CLI</text><text x="855.0" y="154.0" text-anchor="middle" font-size="12" fill="#5b6475">python -m app.cli ask / chat</text><rect x="70" y="196" width="480" height="54" rx="8" fill="#ffffff" stroke="#8a93a6" stroke-width="1.4"/><text x="310.0" y="219.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2330">FastAPI + Pydantic  (api.py)</text><text x="310.0" y="237.0" text-anchor="middle" font-size="12" fill="#5b6475">X-API-Key -&gt; User: department + clearance (auth.py)</text><rect x="70" y="276" width="900" height="54" rx="8" fill="#ffffff" stroke="#8a93a6" stroke-width="1.4"/><text x="520.0" y="299.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2330">Assistant.ask  (assistant.py)</text><text x="520.0" y="317.0" text-anchor="middle" font-size="12" fill="#5b6475">checks the session belongs to this user, runs the graph, builds the validated response, logs it</text><path d="M180 162 L180 194" fill="none" stroke="#8a93a6" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M440 162 L440 194" fill="none" stroke="#8a93a6" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M310 250 L310 274" fill="none" stroke="#8a93a6" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M855 162 L855 274" fill="none" stroke="#8a93a6" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M1040 278 v50 a110.0 8 